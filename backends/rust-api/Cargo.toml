[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
lettre = "0.11"
thiserror = "2"
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0"
lettre_email = "0.9.4"
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] } 
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"]}
