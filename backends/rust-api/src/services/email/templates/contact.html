<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="dark">
        <meta name="supported-color-schemes" content="dark">
        <title>New client inquiry</title>
    </head>

    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #030303;
            color: #f4f4f5;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            -webkit-font-smoothing: antialiased;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
                width: 100%;
                background-color: #030303;
                border-collapse: collapse;
            "
        >
            <tr>
                <td align="center" style="padding: 16px 8px;">
                    <table
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                        style="
                            width: 100%;
                            max-width: 560px;
                            background-color: #0d0d0d;
                            border: 1px solid rgba(255, 255, 255, 0.12);
                            border-radius: 12px;
                            border-collapse: separate;
                            overflow: hidden;
                        "
                    >
                        <tr>
                            <td
                                style="
                                    height: 4px;
                                    background-color: #d40818;
                                    font-size: 0;
                                    line-height: 0;
                                "
                            >
                                &nbsp;
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 16px 16px 10px;">
                                <table
                                    role="presentation"
                                    width="100%"
                                    cellspacing="0"
                                    cellpadding="0"
                                    border="0"
                                    style="border-collapse: collapse;"
                                >
                                    <tr>
                                        <td valign="middle">
                                            <div
                                                style="
                                                    margin: 0 0 4px;
                                                    color: #8a8a8d;
                                                    font-size: 11px;
                                                    font-weight: 700;
                                                    line-height: 14px;
                                                    letter-spacing: 1.2px;
                                                    text-transform: uppercase;
                                                "
                                            >
                                                Portfolio
                                            </div>

                                            <h1
                                                style="
                                                    margin: 0;
                                                    color: #f4f4f5;
                                                    font-size: 20px;
                                                    font-weight: 700;
                                                    line-height: 26px;
                                                "
                                            >
                                                New client request
                                            </h1>
                                        </td>

                                        <td align="right" valign="middle">
                                            <span
                                                style="
                                                    display: inline-block;
                                                    padding: 4px 8px;
                                                    background-color: #760008;
                                                    border: 1px solid rgba(212, 8, 24, 0.45);
                                                    border-radius: 999px;
                                                    color: #f4f4f5;
                                                    font-size: 11px;
                                                    font-weight: 700;
                                                    line-height: 14px;
                                                "
                                            >
                                                New
                                            </span>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 0 16px 12px;">
                                <div
                                    style="
                                        height: 1px;
                                        background-color: rgba(255, 255, 255, 0.06);
                                        font-size: 0;
                                        line-height: 0;
                                    "
                                >
                                    &nbsp;
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 0 16px 8px;">
                                <table
                                    role="presentation"
                                    width="100%"
                                    cellspacing="0"
                                    cellpadding="0"
                                    border="0"
                                    style="
                                        width: 100%;
                                        background-color: #151515;
                                        border: 1px solid rgba(255, 255, 255, 0.06);
                                        border-radius: 8px;
                                        border-collapse: separate;
                                    "
                                >
                                    <tr>
                                        <td
                                            width="90"
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #8a8a8d;
                                                font-size: 12px;
                                                font-weight: 600;
                                                line-height: 18px;
                                            "
                                        >
                                            Subject
                                        </td>

                                        <td
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #f4f4f5;
                                                font-size: 13px;
                                                line-height: 18px;
                                                word-break: break-word;
                                            "
                                        >
                                            {{subject}}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            colspan="2"
                                            style="
                                                height: 1px;
                                                padding: 0;
                                                background-color: rgba(255, 255, 255, 0.06);
                                                font-size: 0;
                                                line-height: 0;
                                            "
                                        >
                                            &nbsp;
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            width="90"
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #8a8a8d;
                                                font-size: 12px;
                                                font-weight: 600;
                                                line-height: 18px;
                                            "
                                        >
                                            Name
                                        </td>

                                        <td
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #f4f4f5;
                                                font-size: 13px;
                                                line-height: 18px;
                                                word-break: break-word;
                                            "
                                        >
                                            {{name}}
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            colspan="2"
                                            style="
                                                height: 1px;
                                                padding: 0;
                                                background-color: rgba(255, 255, 255, 0.06);
                                                font-size: 0;
                                                line-height: 0;
                                            "
                                        >
                                            &nbsp;
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            width="90"
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #8a8a8d;
                                                font-size: 12px;
                                                font-weight: 600;
                                                line-height: 18px;
                                            "
                                        >
                                            Email
                                        </td>

                                        <td
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                font-size: 13px;
                                                line-height: 18px;
                                                word-break: break-word;
                                            "
                                        >
                                            <a
                                                href="mailto:{{email}}"
                                                style="
                                                    color: #ef1425;
                                                    text-decoration: none;
                                                "
                                            >
                                                {{email}}
                                            </a>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            colspan="2"
                                            style="
                                                height: 1px;
                                                padding: 0;
                                                background-color: rgba(255, 255, 255, 0.06);
                                                font-size: 0;
                                                line-height: 0;
                                            "
                                        >
                                            &nbsp;
                                        </td>
                                    </tr>

                                    <tr>
                                        <td
                                            width="90"
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                color: #8a8a8d;
                                                font-size: 12px;
                                                font-weight: 600;
                                                line-height: 18px;
                                            "
                                        >
                                            Phone
                                        </td>

                                        <td
                                            valign="top"
                                            style="
                                                padding: 6px 8px;
                                                font-size: 13px;
                                                line-height: 18px;
                                                word-break: break-word;
                                            "
                                        >
                                            <a
                                                href="tel:{{phone}}"
                                                style="
                                                    color: #c4c4c6;
                                                    text-decoration: none;
                                                "
                                            >
                                                {{phone}}
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 4px 16px 8px;">
                                <div
                                    style="
                                        margin: 0 0 6px;
                                        color: #8a8a8d;
                                        font-size: 11px;
                                        font-weight: 700;
                                        line-height: 14px;
                                        letter-spacing: 0.8px;
                                        text-transform: uppercase;
                                    "
                                >
                                    Message
                                </div>

                                <div
                                    style="
                                        padding: 8px 10px;
                                        background-color: #151515;
                                        border: 1px solid rgba(255, 255, 255, 0.06);
                                        border-left: 3px solid #d40818;
                                        border-radius: 8px;
                                        color: #c4c4c6;
                                        font-size: 13px;
                                        line-height: 20px;
                                        white-space: pre-wrap;
                                        word-break: break-word;
                                    "
                                >
                                    {{message}}
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td style="padding: 8px 16px 16px;">
                                <table
                                    role="presentation"
                                    cellspacing="0"
                                    cellpadding="0"
                                    border="0"
                                    style="border-collapse: separate;"
                                >
                                    <tr>
                                        <td
                                            align="center"
                                            style="
                                                background-color: #d40818;
                                                border-radius: 7px;
                                            "
                                        >
                                            <a
                                                href="mailto:{{email}}"
                                                style="
                                                    display: inline-block;
                                                    padding: 7px 12px;
                                                    color: #ffffff;
                                                    font-size: 12px;
                                                    font-weight: 700;
                                                    line-height: 16px;
                                                    text-decoration: none;
                                                "
                                            >
                                                Reply to client
                                            </a>
                                        </td>

                                        <td width="8">&nbsp;</td>

                                        <td
                                            align="center"
                                            style="
                                                background-color: #151515;
                                                border: 1px solid rgba(255, 255, 255, 0.12);
                                                border-radius: 7px;
                                            "
                                        >
                                            <a
                                                href="tel:{{phone}}"
                                                style="
                                                    display: inline-block;
                                                    padding: 6px 12px;
                                                    color: #f4f4f5;
                                                    font-size: 12px;
                                                    font-weight: 700;
                                                    line-height: 16px;
                                                    text-decoration: none;
                                                "
                                            >
                                                Call
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td
                                style="
                                    padding: 8px 16px;
                                    background-color: #080808;
                                    border-top: 1px solid rgba(255, 255, 255, 0.06);
                                    color: #5d5d60;
                                    font-size: 10px;
                                    line-height: 15px;
                                "
                            >
                                This message was submitted through your portfolio contact form.
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
