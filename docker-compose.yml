services:
  rust-api: 
    build:
      context: rust-backend-api
      target: development
    env_file: 
      - ./backends/.env
    ports: 
      - "4040:8000" 
    volumes:
      - ./backends/rust-api:/code/rust-api
    depends_on:
      - db

  python-api:
    build:
      context: python-backend-api
      target: development
    env_file: 
      - ./backends/.env
    ports: 
      - "4041:8001" 
    volumes: 
      - ./backends/python-api:/code/python-api
    depends_on:
      - db

  db:
    image: postgres:18
    env_file: 
      - ./backends/.env 
    volumes:
      - db-data:/var/lib/postgresql
      - ./backends/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
          [
              "CMD-SHELL",
              "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
          ]
      interval: 5s
      timeout: 5s
      retries: 10  
    
    frontend:
      build:
        context: ./frontend
        target: development
      env_file:
        - ./frontend/.env
      ports:
        - "3000:3000" 
      volumes:
        - ./frontend:/code/frontend
        - frontend-node-modules:/code/frontend/node_modules
      depends_on:
        - rust-api
        - python-api
    

  volumes: 
    db-data:
    rust-target:
    frontend-node-modules: