  <text x="58" y="142" font-family="'Bricolage Grotesque', Arial, sans-serif" font-size="54" font-weight="800" fill="#171B1E">A warm foundation. A sharp signal.</text>
  <g transform="translate(58 205)">
    <rect width="260" height="190" rx="14" fill="#171B1E"/>
    <rect x="276" width="260" height="190" rx="14" fill="#F1EEE6" stroke="#171B1E" stroke-width="2"/>
    <rect x="552" width="260" height="190" rx="14" fill="#FF4D2E"/>
    <rect x="828" width="260" height="190" rx="14" fill="#5263E8"/>
    <rect x="1104" width="260" height="190" rx="14" fill="#B8644D"/>
    <g font-family="'Azeret Mono', monospace" font-size="17" fill="#171B1E">
      <text x="0" y="230" font-weight="700">GRAPHITE INK</text><text x="0" y="260">#171B1E</text>
      <text x="276" y="230" font-weight="700">WARM PAPER</text><text x="276" y="260">#F1EEE6</text>
