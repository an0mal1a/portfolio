<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
  <style>@import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;display=swap');</style>

  <rect width="1500" height="540" fill="#F1EEE6"/>
